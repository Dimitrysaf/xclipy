<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Mint-Y's mintreport icon (a clipboard on its app frame), with a pen in place of the
       exclamation mark and a deeper blue gradient than System Settings' Panel icon,
       to stand out from the white paper. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="18" x2="0" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a9eea"/>
      <stop offset="1" stop-color="#1c5fc4"/>
    </linearGradient>
    <clipPath id="paper">
      <rect x="48" y="48" width="160" height="160" rx="34"/>
    </clipPath>
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="127.5" cy="41.5" r="4.5" fill="#000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- The frame, rounded as Mint-Y's: a 1 px dark outline, a light line inside its top
       edge, a short soft shadow. -->
  <rect x="18" y="19.5" width="220" height="220" rx="50" fill="#000" fill-opacity=".35" filter="url(#edge)"/>
  <rect x="18.5" y="18.5" width="219" height="219" rx="49.5" fill="url(#bg)" stroke="#123a73" stroke-opacity=".75"/>
  <rect x="19.5" y="19.5" width="217" height="217" rx="48.5" fill="none" stroke="#fff" stroke-opacity=".25"/>

  <!-- The paper, its shadow, its grid and its margin. -->
  <rect x="48" y="49" width="160" height="160" rx="34" fill="#000" fill-opacity=".3"/>
  <rect x="48" y="48" width="160" height="160" rx="34" fill="#fff"/>
  <g clip-path="url(#paper)" stroke-width="1">
    <path d="M48 81.5h160M48 111.5h160M48 143.5h160M48 174.5h160" stroke="#eaeaea"/>
    <path d="M81.5 48v160" stroke="#f6dcda"/>
  </g>

  <!-- The clip and its ring. -->
  <g fill="#c3c8cd" mask="url(#ring)">
    <circle cx="127.5" cy="41.5" r="11"/>
    <rect x="87" y="42" width="80" height="21" rx="4"/>
  </g>
  <rect x="88" y="63" width="78" height="1" fill="#b3b3b3"/>

  <!-- The pen, writing on the paper. -->
  <g transform="translate(131 125) rotate(-45)">
    <g filter="url(#soft)" fill="#000" fill-opacity=".2" transform="translate(4 5)">
      <path d="M-64 0L-46-11H58a4 4 0 0 1 4 4V7a4 4 0 0 1-4 4H-46Z"/>
    </g>
    <!-- Nib and its metal cone. -->
    <path d="M-46-11L-64 0L-46 11Z" fill="#8c939a"/>
    <path d="M-55.6-5.1L-64 0L-55.6 5.1Z" fill="#3c4045"/>
    <!-- Grip. -->
    <rect x="-46" y="-11" width="12" height="22" fill="#c3c8cd"/>
    <rect x="-46" y="0" width="12" height="11" fill="#aeb4ba"/>
    <!-- Body, lit from above. -->
    <path d="M-34-11H52V11H-34Z" fill="#e22c1e"/>
    <path d="M-34 0H52V11H-34Z" fill="#c4241a"/>
    <!-- Cap at the end, with its clip. -->
    <path d="M52-11h6a4 4 0 0 1 4 4V7a4 4 0 0 1-4 4h-6Z" fill="#a51d13"/>
    <rect x="18" y="-14" width="34" height="5" rx="2.5" fill="#c3c8cd"/>
  </g>
</svg>
